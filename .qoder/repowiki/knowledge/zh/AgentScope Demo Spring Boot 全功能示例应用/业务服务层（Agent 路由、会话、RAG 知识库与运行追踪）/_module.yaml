related_to:
    - path: controllers
      reason: ChatController/KnowledgeController/WorkflowController 通过构造器注入 AgentService、KnowledgeService、WorkflowRunService 调用其方法并返回 SSE/REST 响应。
    - path: runtime_engine
      reason: AgentService.createStreamFlux 使用 StreamingAgentRuntimeFactory 按 AgentType 创建运行时实例，并以 Flux.merge 合并 AgentEventMapper 输出的事件流。
    - path: harness
      reason: AgentService 对 Harness 类型直接委托给 HarnessAgentService.createStreamFlux，复用其 Session/UserId 缓存化 HarnessAgent 运行能力。
